<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>SK Aneke Hall of Fame | Department of Air Warfare</title>
<link rel="icon" href="assets/icons/app.ico" sizes="any" />
<link rel="stylesheet" href="assets/fonts/fonts.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="stage-wrapper" id="stage-wrapper">
    <div class="stage" id="stage">

      <!-- ============ PERSISTENT TOP BAR ============ -->
      <header class="topbar hidden" id="topbar">
        <button class="brand" data-act="home" aria-label="Go to the welcome screen">
          <span class="brand-crests">
            <img class="crest" src="assets/icons/naf.png" alt="Nigerian Air Force crest" />
            <img class="crest" src="assets/icons/afcsc.png" alt="Armed Forces Command and Staff College crest" />
          </span>
          <span class="brand-text">
            <span class="brand-host">Armed Forces Command and Staff College, Jaji</span>
            <span class="brand-name">SK Aneke Hall of Fame <span class="brand-dot">·</span> The History Experience</span>
          </span>
        </button>

        <div class="topbar-section" id="topbar-section">
          <span class="topbar-n" id="section-n"></span>
          <span class="topbar-rule"></span>
          <span class="topbar-title" id="section-title"></span>
        </div>

        <nav class="topbar-actions" aria-label="Exhibition controls">
          <button class="btn btn--paper" data-act="back">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>
            Back
          </button>
          <button class="btn btn--paper" data-act="home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-6h5v6"/></svg>
            Home
          </button>
          <button class="btn btn--navy" data-act="close-app" aria-label="Close the Hall of Fame">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            Close
          </button>
        </nav>
      </header>

      <!-- ============ SCREEN ============ -->
      <main class="screens" id="screens">
        <section class="screen" id="screen"></section>
      </main>

      <!-- ============ GALLERY DOCK ============ -->
      <nav class="dock hidden" id="dock" aria-label="Exhibition galleries">
        <button class="dock-end dock-end--prev" data-act="prev-section" id="dock-prev">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
          <span class="dock-end-text"><span class="dock-end-kicker">Previous</span><span class="dock-end-label" id="dock-prev-label">Welcome</span></span>
        </button>
        <div class="dock-items" id="dock-items"></div>
        <button class="dock-end dock-end--next" data-act="next-section" id="dock-next">
          <span class="dock-end-text"><span class="dock-end-kicker">Next</span><span class="dock-end-label" id="dock-next-label"></span></span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        </button>
      </nav>

      <!-- ============ PHOTO VIEWER ============ -->
      <div class="lightbox hidden" id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph viewer">
        <div class="lightbox-glow" aria-hidden="true"></div>
        <header class="lightbox-top">
          <div class="lightbox-count">
            <span class="lightbox-n" id="lightbox-n">01</span>
            <span class="lightbox-of">/ <span id="lightbox-total">01</span></span>
          </div>
          <span class="eyebrow lightbox-collection" id="lightbox-collection"></span>
          <button class="btn btn--glass" data-act="lightbox-close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            Close
          </button>
        </header>
        <div class="lightbox-stage">
          <button class="round-btn round-btn--glass lightbox-prev" data-act="lightbox-prev" aria-label="Previous photograph">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
          </button>
          <div class="lightbox-frame" id="lightbox-frame"><img id="lightbox-img" alt="" /></div>
          <button class="round-btn round-btn--glass lightbox-next" data-act="lightbox-next" aria-label="Next photograph">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
          </button>
        </div>
        <footer class="lightbox-foot">
          <div class="lightbox-caption" id="lightbox-caption"></div>
          <div class="lightbox-strip" id="lightbox-strip"></div>
        </footer>
      </div>

      <!-- ============ RECORD VIEWER (chiefs and collage) ============ -->
      <div class="record hidden" id="record" role="dialog" aria-modal="true" aria-label="Record viewer">
        <div class="record-stage">
          <div class="record-grain" aria-hidden="true"></div>
          <div class="record-figure" id="record-figure">
            <img id="record-img" alt="" />
          </div>
          <div class="record-stage-top">
            <span class="record-fig" id="record-fig"></span>
          </div>
          <div class="record-stage-nav">
            <button class="round-btn" data-act="record-prev" aria-label="Previous record">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
            </button>
            <span class="record-hint" id="record-hint"></span>
            <button class="round-btn round-btn--navy" data-act="record-next" aria-label="Next record">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
            </button>
          </div>
        </div>
        <aside class="record-panel">
          <div class="record-actions">
            <button class="btn btn--navy" data-act="record-close">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
              Close
            </button>
          </div>
          <div class="record-body" id="record-body"></div>
        </aside>
      </div>

      <!-- ============ FILM PLAYER ============ -->
      <div class="player hidden" id="player" role="dialog" aria-modal="true" aria-label="Film player">
        <video id="player-video" playsinline preload="auto"></video>
        <div class="player-missing hidden" id="player-missing">
          <div class="eyebrow">Coming soon</div>
          <div class="player-missing-title">This film is being added to the Hall of Fame.</div>
          <div class="player-missing-sub" id="player-missing-file"></div>
        </div>
        <div class="player-top">
          <div class="player-heading">
            <span class="player-sub" id="player-sub"></span>
            <span class="player-title" id="player-title"></span>
          </div>
          <button class="btn btn--glass" data-act="film-close" aria-label="Close film">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            Close
          </button>
        </div>
        <div class="player-bottom">
          <button class="round-btn round-btn--brass" data-act="film-toggle" aria-label="Play or pause" id="player-toggle">
            <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14l12-7Z"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
          </button>
          <span class="player-time" id="player-time">0:00 / 0:00</span>
          <div class="player-scrub" id="player-scrub" role="slider" aria-label="Seek"><div class="player-scrub-fill" id="player-scrub-fill"></div></div>
          <button class="btn btn--glass" data-act="film-read" id="player-read">Read the story</button>
          <button class="btn btn--glass" data-act="film-next" id="player-next">Next film</button>
        </div>
      </div>

      <!-- ============ IDLE WARNING ============ -->
      <div class="idle hidden" id="idle" data-act="idle-stay">
        <div class="idle-card">
          <div class="idle-ring"><span id="idle-count">10</span></div>
          <div class="idle-title">Are you still exploring?</div>
          <div class="idle-sub">Touch anywhere to carry on. The Hall of Fame will return to its welcome screen shortly.</div>
        </div>
      </div>

    </div>
  </div>

  <script src="data/content.js"></script>
  <script src="script.js"></script>
</body>
</html>
